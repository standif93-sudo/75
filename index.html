<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ГМТ — Гомельские Мобильные Телесистемы</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="screen">
      <header class="topbar glass-card">
        <div>
          <p class="eyebrow">Оператор связи</p>
          <h1>ГМТ</h1>
          <p class="subtitle">Гомельские Мобильные Телесистемы</p>
        </div>
        <button class="ghost-btn" aria-label="Открыть профиль">⚪</button>
      </header>

      <section class="balance glass-card">
        <p>Баланс</p>
        <h2>48,30 BYN</h2>
        <small>Следующее списание: 29 апреля</small>
      </section>

      <section class="quick-actions">
        <button class="glass-card action">
          <span>📶</span>
          <p>Тариф</p>
        </button>
        <button class="glass-card action">
          <span>➕</span>
          <p>Пополнить</p>
        </button>
        <button class="glass-card action">
          <span>🎁</span>
          <p>Бонусы</p>
        </button>
      </section>

      <section class="plans glass-card">
        <h3>Пакет «ГМТ Liquid»</h3>
        <ul>
          <li><strong>45 ГБ</strong> интернета</li>
          <li><strong>700 минут</strong> по Беларуси</li>
          <li><strong>Безлимит</strong> на мессенджеры</li>
        </ul>
        <button class="primary-btn">Подключить за 19,90 BYN</button>
      </section>

      <nav class="tabbar glass-card" aria-label="Нижнее меню">
        <a href="#" class="active">Главная</a>
        <a href="#">Услуги</a>
        <a href="#">Поддержка</a>
        <a href="#">Профиль</a>
      </nav>
    </main>
  </body>
</html>
